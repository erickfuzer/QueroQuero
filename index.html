<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quero-Quero · Radar de voos</title>
  <meta name="description" content="Rastreador de voos em tempo real feito em HTML, CSS e JavaScript puros: aviões no mapa com rumo, altitude, velocidade, rastro e rota.">
  <meta name="theme-color" content="#0b0f14">

  <!-- Ícone da aba: emoji em SVG, sem precisar de arquivo de imagem -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dominant-baseline='central'>✈️</text></svg>">

  <!-- Prévia do link ao compartilhar (WhatsApp, Discord, redes sociais) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:url" content="https://erickfuzer.github.io/QueroQuero/">
  <meta property="og:title" content="Quero-Quero · Radar de voos">
  <meta property="og:description" content="Aviões em tempo real no mapa, com rumo, altitude, velocidade, rastro e rota. Feito em HTML, CSS e JavaScript puros.">
  <meta property="og:image" content="https://erickfuzer.github.io/QueroQuero/assets/social-preview.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="Mapa escuro do sul do Brasil com aviões coloridos pela altitude e o painel de um voo aberto">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fonte: Inter para a interface, JetBrains Mono para números e indicativos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
        integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="mapa" aria-label="Mapa com os aviões"></div>

  <!-- Barra superior: marca, busca e contagem -->
  <header class="barra">
    <div class="marca">
      <span class="marca-icone" aria-hidden="true">✈️</span>
      <div>
        <h1>Quero-Quero</h1>
        <p id="contagem">Carregando…</p>
      </div>
    </div>
    <div class="busca">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
      <input id="busca" type="search" placeholder="Buscar indicativo" autocomplete="off" spellcheck="false"
             aria-label="Buscar voo por indicativo ou matrícula" aria-controls="sugestoes" aria-autocomplete="list">
      <ul id="sugestoes" class="sugestoes" role="listbox" hidden></ul>
    </div>
  </header>

  <!-- Avisos (limite da API, falha de rede etc.) -->
  <div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>

  <!-- Painel do voo selecionado (folha inferior no celular) -->
  <aside id="painel" class="painel" aria-label="Detalhes do voo" hidden>
    <button class="painel-fechar" id="fechar" aria-label="Fechar painel">×</button>
    <div class="painel-alca" aria-hidden="true"></div>
    <div class="painel-topo">
      <h2 id="p-indicativo">–</h2>
      <p id="p-companhia" class="sub"></p>
      <p id="p-aeronave" class="sub"></p>
    </div>
    <div id="p-rota" class="rota"></div>
    <dl class="dados">
      <div><dt>Altitude</dt><dd id="p-altitude">–</dd></div>
      <div><dt>Velocidade</dt><dd id="p-velocidade">–</dd></div>
      <div><dt>Rumo</dt><dd id="p-rumo">–</dd></div>
      <div><dt>Vel. vertical</dt><dd id="p-vertical">–</dd></div>
      <div><dt>País de registro</dt><dd id="p-pais">–</dd></div>
      <div><dt>Squawk</dt><dd id="p-squawk">–</dd></div>
    </dl>
    <p class="rodape-painel"><span id="p-hex"></span><span id="p-visto"></span></p>
  </aside>

  <!-- Legenda de cores e filtro por altitude -->
  <section id="legenda" class="legenda" aria-label="Legenda e filtro por altitude">
    <button id="legenda-alternar" class="legenda-titulo" aria-expanded="true" aria-controls="filtro">
      <span>Altitude (pés)</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <div class="escala" aria-hidden="true"></div>
    <div class="escala-rotulos" aria-hidden="true">
      <span>solo</span><span>10 mil</span><span>20 mil</span><span>30 mil</span><span>40 mil+</span>
    </div>
    <div id="filtro" class="filtro">
      <label>Mínima <output id="min-saida">solo</output>
        <input id="alt-min" type="range" min="0" max="45000" step="1000" value="0">
      </label>
      <label>Máxima <output id="max-saida">sem limite</output>
        <input id="alt-max" type="range" min="0" max="45000" step="1000" value="45000">
      </label>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
          integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
